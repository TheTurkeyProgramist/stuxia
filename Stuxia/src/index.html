<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body class="is-loading">
    <div class="bg" aria-hidden="true">
      <div class="bg__image"></div>
      <div class="bg__fog"></div>
      <div class="bg__shade"></div>
    </div>

    <main class="container">
      <h1 class="reveal" data-at="10" data-anim="drop">Welcome to Tauri</h1>

      <div class="row reveal" data-at="30" data-anim="spin">
        <a href="https://tauri.app" target="_blank">
          <img src="/assets/tauri.svg" class="logo tauri" alt="Tauri logo" />
        </a>
        <a
          href="https://developer.mozilla.org/en-US/docs/Web/JavaScript"
          target="_blank"
        >
          <img
            src="/assets/javascript.svg"
            class="logo vanilla"
            alt="JavaScript logo"
          />
        </a>
      </div>
      <p class="reveal" data-at="50" data-anim="flip">
        Click on the Tauri logo to learn more about the framework
      </p>

      <form class="row reveal" id="greet-form" data-at="70" data-anim="zoom">
        <input id="greet-input" placeholder="Enter a name..." />
        <button type="submit">Greet</button>
      </form>
      <p id="greet-msg"></p>
    </main>

    <div id="loader" class="loader" role="status" aria-live="polite">
      <div class="loader__head">
        <span class="loader__title">Стихія</span>
        <span class="loader__percent" id="loader-percent">0%</span>
      </div>
      <div class="loader__bar">
        <div class="loader__fill" id="loader-fill"></div>
      </div>
      <p class="loader__tip" id="loader-tip"></p>
    </div>
  </body>
</html>
