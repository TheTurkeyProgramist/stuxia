# Cloudflare Pages: статична збірка з dist + функції з папки functions/
# (functions/api/news-feed.js → /api/news-feed, functions/api/frame-check.js → /api/frame-check)
# Які адреси взагалі запускають функції — public/_routes.json (/api/* і маніфести для ШІ-агентів,
# на які functions/_middleware.js відповідає 404). Нова функція поза /api/ — додай її туди.
name = "stuxia"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Сховище погоди «серверних» міст (functions/api/city-weather.js, блискавка в пошуку).
# Створене командою `bun x wrangler kv namespace create CITY_WEATHER` (17.11.2026).
# Якщо прив'язку прибрати, функція відповідає 503, а сайт бере погоду напряму з Open-Meteo.
[[kv_namespaces]]
binding = "CITY_WEATHER"
id = "cb7f23a013cc4cfb8de699ee5cb5ed4d"
