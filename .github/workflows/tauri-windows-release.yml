name: Build Windows desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - name: Install website dependencies
        run: bun install --frozen-lockfile

      - name: Build website frontend
        run: bun run build

      - name: Install Tauri dependencies
        working-directory: Stuxia
        run: bun install

      - name: Build Windows installers
        working-directory: Stuxia
        run: bun run tauri build

      - name: Prepare stable installer names
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "Stuxia/src-tauri/target/release/bundle/nsis/*.exe" "release-assets/Stuxia-Setup-Windows.exe"
          Copy-Item "Stuxia/src-tauri/target/release/bundle/msi/*.msi" "release-assets/Stuxia-Windows.msi"

      - name: Publish installers
        uses: softprops/action-gh-release@v2
        with:
          name: Stuxia ${{ github.ref_name }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}